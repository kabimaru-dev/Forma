# Forma — настройка новой кнопки. Меняйте enabled: true / false и подписи.
# Имена моделей нигде в интерфейсе не показываются.
# Reasoning: 7 переключателей внутри КАЖДОГО уровня. Speed: 2 варианта.
# Каждый enabled переключается независимо. Сервер проверяет блокировки при отправке.
# Пустая модель = режим виден, но отправка недоступна до заполнения.
# Файл перечитывается при следующем запросе.

speed:
  normal:
    enabled: true
  fast:
    enabled: true

custom:
  enabled: false # кнопка «Custom» пока заблокирована
  options:
    option_1:
      enabled: false
      label: "Скоро 1"
    option_2:
      enabled: false
      label: "Скоро 2"
    option_3:
      enabled: false
      label: "Скоро 3"
    option_4:
      enabled: false
      label: "Скоро 4"
    option_5:
      enabled: false
      label: "Скоро 5"

# Под каждым уровнем 7 НЕЗАВИСИМЫХ Thinking Effort (minimal/low/medium/high/extra_high/max/ultra).
# Отключение, например, minimal/models/high/enabled не блокирует moderate/models/high.
